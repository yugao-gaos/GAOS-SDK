[project]
name = "gaos-sdk"
version = "0.25.0"
description = "Product-neutral Python client and evidence tools for the Game-Agent Open Standard"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Deliberately zero runtime dependencies.
dependencies = []

[project.scripts]
gaos-verify = "gaos_sdk.verify:main"

[project.urls]
Homepage = "https://yugao-gaos.github.io/GAOS-SDK/"
Documentation = "https://yugao-gaos.github.io/GAOS-SDK/python"
Repository = "https://github.com/yugao-gaos/GAOS-SDK"
Issues = "https://github.com/yugao-gaos/GAOS-SDK/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gaos_sdk*"]
