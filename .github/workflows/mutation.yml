name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Godot 4.7 stable
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 \
            "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" \
            /usr/local/bin/godot
          godot --version
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: typescript-mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest --cov=gaos_sdk --cov-branch --cov-report= --cov-fail-under=65
        working-directory: python
      - run: python -m mutmut run
        working-directory: python
      - run: python -m mutmut export-cicd-stats
        working-directory: python
      - run: python check_mutation_score.py
        working-directory: python
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-mutation-stats
          path: python/mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
