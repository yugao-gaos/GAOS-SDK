name: SDK CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    strategy:
      matrix:
        node: ['20.3', '22']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - name: Install Godot 4.7 stable
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 \
            "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" \
            /usr/local/bin/godot
          godot --version
      - run: npm test
      - run: npm run build
      - run: npm run dmath:evidence
      - run: npm pack --dry-run

  dmath-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run dmath:browsers
      - run: npm run dmath:workerd

  python:
    strategy:
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install build pytest jsonschema
      - run: PYTHONPATH=python python -m pytest python/tests
      - run: python -m build python
