name: Publish SDK release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Verify release tag matches TypeScript and Python package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dmath:evidence
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run dmath:browsers
      - run: npm run dmath:workerd
      - run: npm run docs:build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build pytest jsonschema
      - run: PYTHONPATH=python python -m pytest python/tests
      - run: python -m build python

      - name: Smoke test installable archives
        shell: bash
        run: |
          npm_tarball=$(npm pack --silent | tail -n 1)
          smoke_dir="$RUNNER_TEMP/gaos-npm-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$npm_tarball" >/dev/null
          node --input-type=module -e "
            const engine = await import('@yugao-gaos/turn-based-grid-sdk/engine');
            if (engine.GAOS_REPLAY_FORMAT_VERSION !== '1.2') process.exit(1);
          "
          test -f node_modules/@yugao-gaos/turn-based-grid-sdk/schemas/gaos.replay-v1.schema.json
          test -f node_modules/@yugao-gaos/turn-based-grid-sdk/fixtures/replay/gaos-replay-v1.golden.jsonl
          cd "$GITHUB_WORKSPACE"
          python -m pip install --force-reinstall python/dist/*.whl
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" python -c "
          import os, agilabs_arena
          assert agilabs_arena.__version__ == os.environ['EXPECTED_VERSION']
          assert agilabs_arena.GAOS_REPLAY_FORMAT_VERSION == '1.2'
          "

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach installable archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm_tarball=$(npm pack --silent | tail -n 1)
          gh release upload "${{ github.event.release.tag_name }}" "$npm_tarball" python/dist/* --clobber
