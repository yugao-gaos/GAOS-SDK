name: Publish SDK release
run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v1.0.0
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Verify the release exists and remains a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Verify release tag matches TypeScript and Python package versions
        run: node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm run typecheck
      - name: Install Godot 4.7 stable
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 \
            "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" \
            /usr/local/bin/godot
          godot --version
      - run: npm run test:coverage
      - run: npm run test:mutation
      - run: npm run build
      - run: npm run api:check
      - run: npm run dmath:evidence
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run dmath:browsers
      - run: npm run dmath:workerd
      - run: npm run docs:build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build -e "python[dev]"
      - run: python -m pytest python/tests --cov=gaos_sdk --cov-branch --cov-report=term-missing --cov-fail-under=65
      - run: python -m build python

      - name: Smoke test npm archive
        run: npm run smoke:package

      - name: Smoke test Python wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall python/dist/*.whl
          EXPECTED_VERSION="${RELEASE_TAG#v}" python -c "
          import os, gaos_sdk
          assert gaos_sdk.__version__ == os.environ['EXPECTED_VERSION']
          assert gaos_sdk.GAOS_REPLAY_FORMAT_VERSION == '1.3'
          "

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach installable archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm_tarball=$(npm pack --silent | tail -n 1)
          gh release upload "$RELEASE_TAG" "$npm_tarball" python/dist/* --clobber

      - name: Publish the validated GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false
